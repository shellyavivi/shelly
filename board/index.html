<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moodwall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky toolbar (name, search, category chips) over an endless masonry wall; studios as a second view. */
:root {
  --bg: #f3f3f0; --surface: #ffffff; --ink: #18181a; --muted: #6a6964; --line: #e0dfda;
  --accent: #e2a116; --accent-ink: #1a1405; --scrim: rgba(18,18,17,.72);
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --radius: 10px; --gap: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121211; --surface: #1c1c1a; --ink: #ededE8; --muted: #9a9993; --line: #2d2d2a;
  --accent: #f2b83a; --accent-ink: #1a1405; --scrim: rgba(0,0,0,.8); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1c1c1a; --ink: #ededE8; --muted: #9a9993; --line: #2d2d2a;
  --accent: #f2b83a; --accent-ink: #1a1405; --scrim: rgba(0,0,0,.8); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); padding-inline: 16px; padding-block: 0 48px; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  margin-inline: -16px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
h1 { font: 700 26px/1 var(--display); letter-spacing: -.02em; margin: 0; }
h1 span { color: var(--accent); }
.views { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.views button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-weight: 500; }
.views button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
form.search { flex: 1 1 260px; display: flex; min-width: 0; }
form.search input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 999px 0 0 999px; padding: 7px 14px; }
form.search button { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 0 999px 999px 0; padding: 7px 14px; cursor: pointer; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.sub { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--muted); }
.sub a { text-decoration: none; border-bottom: 1px solid var(--line); }
.sub a:hover { color: var(--ink); border-color: var(--ink); }
.label { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.status { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.dot { font: 11px var(--mono); }
.dot::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; background: var(--line); vertical-align: 1px; }
.dot.ok::before { background: #3aa76d; } .dot.err::before { background: #d4533b; }

.add { display: flex; gap: 6px; flex: 1 1 320px; min-width: 0; }
.add input { flex: 1; min-width: 0; border: 1px dashed var(--muted); background: transparent; border-radius: 8px; padding: 5px 10px; font-size: 13px; }
.add button, .ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer; }

main { padding-top: 16px; }
.wall { columns: 5 240px; column-gap: var(--gap); }
.card { break-inside: avoid; margin: 0 0 var(--gap); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: relative; }
.card .media { display: block; width: 100%; background: var(--line); cursor: zoom-in; border: 0; padding: 0; }
.card img { display: block; width: 100%; height: auto; }
.card iframe { display: block; width: 100%; border: 0; background: var(--surface); }
.meta { padding: 9px 11px 10px; display: grid; gap: 3px; }
.meta .t { font-weight: 600; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.meta .by { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.meta .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.src { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; text-decoration: none; color: var(--muted); }
.src:hover { color: var(--ink); }
.save { border: 0; background: none; cursor: pointer; font-size: 17px; line-height: 1; padding: 2px 4px; color: var(--muted); }
.save[aria-pressed="true"] { color: var(--accent); }
.badge { position: absolute; top: 8px; left: 8px; background: var(--accent); color: var(--accent-ink); font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; }
.remove { position: absolute; top: 6px; right: 6px; border: 0; background: var(--scrim); color: #fff; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; }

.sentinel { padding: 28px 0; text-align: center; color: var(--muted); font: 13px var(--mono); }
.empty { max-width: 60ch; margin: 40px auto; text-align: center; color: var(--muted); }

.studios { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: var(--gap); }
.studio { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-decoration: none; display: grid; }
.studio img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: top; background: var(--line); display: block; }
.studio .meta .t { font: 700 18px/1.1 var(--display); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }

dialog { border: 0; padding: 0; background: transparent; max-width: min(1100px, 94vw); max-height: 92vh; }
dialog::backdrop { background: var(--scrim); }
.lightbox { background: var(--surface); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 280px; max-height: 92vh; }
.lightbox img { width: 100%; height: 100%; max-height: 92vh; object-fit: contain; background: var(--bg); }
.lightbox .side { padding: 18px; display: grid; gap: 10px; align-content: start; overflow: auto; }
.lightbox h2 { font: 700 22px/1.15 var(--display); margin: 0; text-wrap: balance; }
.lightbox .open { display: inline-block; background: var(--ink); color: var(--bg); text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; justify-self: start; }
.close { justify-self: end; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
@media (max-width: 720px) { header { position: static; } }
@media (max-width: 720px) { .lightbox { grid-template-columns: 1fr; } .lightbox img { max-height: 60vh; } }
@media (prefers-reduced-motion: no-preference) { .card { animation: in .35s ease both; } @keyframes in { from { opacity: .3; transform: translateY(6px); } } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Moodwall<span>.</span></h1>
    <div class="views" role="group" aria-label="View">
      <button id="v-wall" aria-pressed="true">Wall</button>
      <button id="v-saved" aria-pressed="false">Saved</button>
      <button id="v-studios" aria-pressed="false">Studios</button>
    </div>
    <form class="search" id="search" role="search">
      <input id="q" type="search" placeholder="Search everything, e.g. stitched logo, soft architecture" aria-label="Search">
      <button>Search</button>
    </form>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Category"></div>
  <div class="sub">
    <span class="label">Dig deeper</span><span id="deeper"></span>
    <span class="label">Sources</span><span class="status" id="status"></span>
  </div>
  <div class="sub">
    <form class="add" id="add">
      <input id="addurl" type="url" placeholder="Paste a Behance, Instagram, Pinterest, YouTube or any link to pin it" aria-label="Link to pin">
      <button>Pin</button>
    </form>
    <button class="ghost" id="export" type="button">Export pins</button>
  </div>
</header>

<main>
  <section id="wallview"><div class="wall" id="wall"></div><div class="sentinel" id="sentinel">Loading…</div></section>
  <section id="studioview" hidden><div class="filters" id="countries"></div><div class="studios" id="studios"></div></section>
</main>

<dialog id="lb"><div class="lightbox"><img id="lb-img" alt=""><div class="side">
  <button class="close" id="lb-close" aria-label="Close">×</button>
  <span class="label" id="lb-src"></span><h2 id="lb-title"></h2><div class="by" id="lb-by"></div>
  <a class="open" id="lb-open" target="_blank" rel="noopener">View source ↗</a>
</div></div></dialog>

<script src="data.js"></script>
<script>
(() => {
const D = window.MOODWALL;
const $ = s => document.querySelector(s);
const el = (tag, props = {}, kids = []) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('mw:' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mw:' + k, JSON.stringify(v)); } catch {} },
};
const strip = html => { const d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent.trim(); };
const PER = 20;

// ---------- Live sources: each returns { items, done } for (query, page) ----------
const SOURCES = {
  arena: { label: 'Are.na', async fetch(q, p) {
    const r = await fetch(`https://api.are.na/v2/search/blocks?q=${encodeURIComponent(q)}&per=${PER}&page=${p}`);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const items = (j.blocks || []).filter(b => b.image).map(b => ({
      id: 'arena:' + b.id, img: b.image.display?.url || b.image.large?.url, title: b.title || b.generated_title || 'Untitled',
      by: (b.source?.url ? new URL(b.source.url).hostname.replace('www.', '') + ' · ' : '') + 'via ' + (b.user?.full_name || 'Are.na'),
      link: b.source?.url || `https://www.are.na/block/${b.id}`, src: 'Are.na' }));
    return { items, done: p >= (j.total_pages || 1) };
  } },
  commons: { label: 'Wikimedia', async fetch(q, p) {
    const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6'
      + `&gsrsearch=${encodeURIComponent(q)}&gsrlimit=${PER}&gsroffset=${(p - 1) * PER}`
      + '&prop=imageinfo&iiprop=url|mime|extmetadata&iiurlwidth=640';
    const r = await fetch(u); if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const pages = Object.values(j.query?.pages || {}).sort((a, b) => a.index - b.index);
    const items = pages.map(pg => ({ pg, ii: pg.imageinfo?.[0] })).filter(({ ii }) => ii?.thumburl && /^image\//.test(ii.mime))
      .map(({ pg, ii }) => ({ id: 'commons:' + pg.pageid, img: ii.thumburl, w: ii.thumbwidth, h: ii.thumbheight,
        title: strip(ii.extmetadata?.ObjectName?.value) || pg.title.replace(/^File:|\.[a-z0-9]+$/gi, ''),
        by: strip(ii.extmetadata?.Artist?.value) || 'Wikimedia Commons', link: ii.descriptionurl, src: 'Wikimedia' }));
    return { items, done: !j.continue };
  } },
  aic: { label: 'Art Institute', async fetch(q, p) {
    const r = await fetch(`https://api.artic.edu/api/v1/artworks/search?q=${encodeURIComponent(q)}&query[term][is_public_domain]=true`
      + `&fields=id,title,artist_title,date_display,image_id,thumbnail&limit=${PER}&page=${p}`);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const items = (j.data || []).filter(a => a.image_id).map(a => ({ id: 'aic:' + a.id,
      img: `https://www.artic.edu/iiif/2/${a.image_id}/full/600,/0/default.jpg`, w: a.thumbnail?.width, h: a.thumbnail?.height,
      title: a.title, by: [a.artist_title, a.date_display].filter(Boolean).join(', '), link: `https://www.artic.edu/artworks/${a.id}`, src: 'Art Institute of Chicago' }));
    return { items, done: p >= (j.pagination?.total_pages || 1) };
  } },
  cma: { label: 'Cleveland Museum', async fetch(q, p) {
    const r = await fetch(`https://openaccess-api.clevelandart.org/api/artworks/?q=${encodeURIComponent(q)}&has_image=1&limit=${PER}&skip=${(p - 1) * PER}`);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const items = (j.data || []).filter(a => a.images?.web?.url).map(a => ({ id: 'cma:' + a.id, img: a.images.web.url,
      w: +a.images.web.width, h: +a.images.web.height, title: a.title,
      by: [a.creators?.[0]?.description, a.creation_date].filter(Boolean).join(', '), link: a.url, src: 'Cleveland Museum of Art' }));
    return { items, done: (p * PER) >= (j.info?.total || 0) };
  } },
};
const status = {};
function renderStatus() {
  $('#status').replaceChildren(...Object.entries(SOURCES).map(([k, s]) =>
    el('span', { className: 'dot ' + (status[k] || ''), textContent: s.label, title: status[k] === 'err' ? 'Not responding right now' : '' })));
}

// ---------- Embeds for pinned links ----------
function embedFor(url) {
  let m;
  if ((m = url.match(/behance\.net\/gallery\/(\d+)/))) return { src: `https://www.behance.net/embed/project/${m[1]}?ilo0=1`, h: 320, name: 'Behance' };
  if ((m = url.match(/instagram\.com\/(?:[\w.]+\/)?(p|reel|tv)\/([\w-]+)/))) return { src: `https://www.instagram.com/${m[1]}/${m[2]}/embed/captioned/`, h: 620, name: 'Instagram' };
  if ((m = url.match(/pinterest\.[a-z.]+\/pin\/(?:[^/]*?-)?(\d{6,})/))) return { src: `https://assets.pinterest.com/ext/embed.html?id=${m[1]}`, h: 560, name: 'Pinterest' };
  if ((m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/))) return { src: `https://www.youtube.com/embed/${m[1]}`, h: 190, name: 'YouTube' };
  if ((m = url.match(/vimeo\.com\/(\d+)/))) return { src: `https://player.vimeo.com/video/${m[1]}`, h: 190, name: 'Vimeo' };
  return null;
}
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
const shot = u => `https://s0.wp.com/mshots/v1/${encodeURIComponent(u)}?w=800&h=600`;
function retryShot(img) { // mshots serves a placeholder while it renders the page; retry a few times
  img.addEventListener('load', () => {
    const n = +(img.dataset.n || 0);
    if (img.naturalWidth && img.naturalWidth < 500 && n < 4) setTimeout(() => { img.dataset.n = n + 1; img.src = img.src.replace(/&r=\d+$/, '') + '&r=' + (n + 1); }, 3000);
  });
}

// ---------- Cards ----------
let saved = store.get('saved', {});
let added = store.get('added', []);
function saveBtn(item) {
  const b = el('button', { className: 'save', textContent: '♥', title: 'Save' });
  const sync = () => b.setAttribute('aria-pressed', String(!!saved[item.id]));
  b.onclick = () => { saved[item.id] ? delete saved[item.id] : (saved[item.id] = item); store.set('saved', saved); sync(); if (view === 'saved') showSaved(); };
  sync(); return b;
}
function card(item) {
  const c = el('article', { className: 'card' });
  const emb = item.link && embedFor(item.link);
  if (emb) {
    c.append(el('iframe', { src: emb.src, height: emb.h, loading: 'lazy', title: item.title || emb.name, allowFullscreen: true }));
    item.src = item.src || emb.name;
  } else if (item.img) {
    const img = el('img', { src: item.img, alt: item.title || '', loading: 'lazy', decoding: 'async' });
    if (item.w && item.h) img.style.aspectRatio = `${item.w} / ${item.h}`;
    img.onerror = () => c.remove();
    c.append(el('button', { className: 'media', onclick: () => openLb(item), ariaLabel: 'Enlarge ' + (item.title || '') }, [img]));
  } else {
    const img = el('img', { src: shot(item.link), alt: '', loading: 'lazy' }); img.style.aspectRatio = '4 / 3'; img.style.objectFit = 'cover'; retryShot(img);
    c.append(el('a', { className: 'media', href: item.link, target: '_blank', rel: 'noopener' }, [img]));
  }
  if (item.pinned) c.append(el('span', { className: 'badge', textContent: 'Pinned' }));
  if (item.mine) c.append(el('button', { className: 'remove', textContent: '×', title: 'Remove pin',
    onclick: () => { added = added.filter(a => a.id !== item.id); store.set('added', added); c.remove(); } }));
  c.append(el('div', { className: 'meta' }, [
    el('div', { className: 't', textContent: item.title || host(item.link) }),
    item.by ? el('div', { className: 'by', textContent: item.by }) : '',
    el('div', { className: 'row' }, [el('a', { className: 'src', href: item.link, target: '_blank', rel: 'noopener', textContent: (item.src || host(item.link)) + ' ↗' }), saveBtn(item)]),
  ]));
  return c;
}
function openLb(item) {
  $('#lb-img').src = item.img; $('#lb-img').alt = item.title || '';
  $('#lb-title').textContent = item.title || ''; $('#lb-by').textContent = item.by || '';
  $('#lb-src').textContent = item.src || ''; $('#lb-open').href = item.link; $('#lb-open').textContent = 'View on ' + (item.src || host(item.link)) + ' ↗';
  $('#lb').showModal();
}
$('#lb-close').onclick = () => $('#lb').close();
$('#lb').onclick = e => { if (e.target === $('#lb')) $('#lb').close(); };

// ---------- Feed ----------
let view = 'wall', cat = store.get('cat', 'teddy-lab'), query = '', feed = null;
const catById = id => D.categories.find(c => c.id === id);
function newFeed() {
  const c = catById(cat);
  const qs = Object.keys(SOURCES).map(k => [k, query || c?.q?.[k]]).filter(([, q]) => q);
  return { seen: new Set(), cursors: qs.map(([k, q]) => ({ k, q, page: 1, done: false })), busy: false, gen: Symbol() };
}
async function loadMore() {
  const f = feed; if (!f || f.busy) return;
  const live = f.cursors.filter(c => !c.done);
  if (!live.length) { $('#sentinel').textContent = f.seen.size ? 'That’s everything for this search. Try another category or term.' : 'Nothing found. Try another term.'; return; }
  f.busy = true; $('#sentinel').textContent = 'Loading…';
  const results = await Promise.all(live.map(async c => {
    try { const r = await SOURCES[c.k].fetch(c.q, c.page); c.page++; c.done = r.done || !r.items.length; status[c.k] = 'ok'; return r.items; }
    catch { c.done = true; status[c.k] = 'err'; return []; }
  }));
  renderStatus();
  if (f !== feed) return;
  const mixed = []; // interleave sources so the wall stays varied
  for (let i = 0; results.some(r => r[i]); i++) results.forEach(r => r[i] && mixed.push(r[i]));
  const wall = $('#wall');
  mixed.forEach(it => { if (!f.seen.has(it.id)) { f.seen.add(it.id); wall.append(card(it)); } });
  f.busy = false;
  if (isNearBottom()) loadMore();
}
const isNearBottom = () => $('#sentinel').getBoundingClientRect().top < innerHeight + 600;
new IntersectionObserver(es => es.some(e => e.isIntersecting) && view === 'wall' && loadMore(), { rootMargin: '800px' }).observe($('#sentinel'));

function pinnedFor(id) {
  const base = D.pinned.map((p, i) => ({ ...p, id: 'pin:' + i, link: p.url, src: p.by, by: null, pinned: true }));
  const mine = added.map(a => ({ ...a, pinned: true, mine: true }));
  return [...mine, ...base].filter(p => query ? true : (!p.cats || p.cats.includes(id) || p.mine));
}
function startWall() {
  view = 'wall'; setViewButtons();
  $('#wallview').hidden = false; $('#studioview').hidden = true;
  const wall = $('#wall'); wall.replaceChildren();
  if (!query) pinnedFor(cat).forEach(p => wall.append(card(p)));
  feed = newFeed(); loadMore();
}
function showSaved() {
  view = 'saved'; setViewButtons(); feed = null;
  $('#wallview').hidden = false; $('#studioview').hidden = true;
  const items = Object.values(saved);
  $('#wall').replaceChildren(...items.map(card));
  $('#sentinel').textContent = items.length ? `${items.length} saved` : 'Nothing saved yet. Tap ♥ on anything to keep it here.';
}

// ---------- Chips + deeper links ----------
function renderChips() {
  $('#chips').replaceChildren(...D.categories.map(c => el('button', { className: 'chip', textContent: c.label,
    ariaPressed: String(!query && c.id === cat), onclick: () => { cat = c.id; query = ''; $('#q').value = ''; store.set('cat', cat); renderChips(); startWall(); } })));
  const c = catById(cat), term = query || c.search, tags = query ? [query.replace(/\W+/g, '')] : c.tags;
  const links = [
    ['Behance', `https://www.behance.net/search/projects/${encodeURIComponent(term)}`],
    ['Pinterest', `https://www.pinterest.com/search/pins/?q=${encodeURIComponent(term)}`],
    ['Dribbble', `https://dribbble.com/search/${encodeURIComponent(term)}`],
    ...tags.map(t => ['#' + t, `https://www.instagram.com/explore/tags/${encodeURIComponent(t.toLowerCase())}/`]),
  ];
  $('#deeper').replaceChildren(...links.flatMap(([t, h], i) => [i ? ' · ' : '', el('a', { href: h, target: '_blank', rel: 'noopener', textContent: t })]));
}
$('#search').onsubmit = e => { e.preventDefault(); query = $('#q').value.trim(); renderChips(); startWall(); };

// ---------- Pins ----------
$('#add').onsubmit = e => {
  e.preventDefault(); const url = $('#addurl').value.trim(); if (!url) return;
  const emb = embedFor(url);
  added.unshift({ id: 'mine:' + Date.now(), link: url, title: emb ? emb.name + ' post' : host(url), src: emb?.name || host(url) });
  store.set('added', added); $('#addurl').value = '';
  if (view !== 'wall') startWall(); else $('#wall').prepend(card({ ...added[0], pinned: true, mine: true }));
};
$('#export').onclick = () => {
  const data = { pinned: added.map(a => ({ url: a.link, title: a.title, by: a.src, cats: [cat] })), saved: Object.values(saved) };
  const a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })), download: 'moodwall-pins.json' });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ---------- Studios ----------
let country = 'All';
function showStudios() {
  view = 'studios'; setViewButtons(); feed = null;
  $('#wallview').hidden = true; $('#studioview').hidden = false;
  const countries = ['All', ...new Set(D.studios.flatMap(s => s.country.split(' / ')))].sort((a, b) => a === 'All' ? -1 : b === 'All' ? 1 : a.localeCompare(b));
  $('#countries').replaceChildren(...countries.map(c => el('button', { className: 'chip', textContent: c, ariaPressed: String(c === country),
    onclick: () => { country = c; showStudios(); } })));
  $('#studios').replaceChildren(...D.studios.filter(s => country === 'All' || s.country.includes(country)).map(s => {
    const img = el('img', { src: shot(s.url), alt: s.name + ' website', loading: 'lazy' }); retryShot(img);
    return el('a', { className: 'studio', href: s.url, target: '_blank', rel: 'noopener' }, [img,
      el('div', { className: 'meta' }, [el('div', { className: 't', textContent: s.name }), el('div', { className: 'by', textContent: s.country + ' · ' + host(s.url) + ' ↗' })])]);
  }));
}
function setViewButtons() { ['wall', 'saved', 'studios'].forEach(v => $('#v-' + v).setAttribute('aria-pressed', String(view === v))); }
$('#v-wall').onclick = startWall; $('#v-saved').onclick = showSaved; $('#v-studios').onclick = showStudios;

if (!catById(cat)) cat = D.categories[0].id;
renderStatus(); renderChips(); startWall();
})();
</script>
</body>
